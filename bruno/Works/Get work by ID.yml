info:
  name: Get work by ID
  type: http
  seq: 1
  tags:
    - Works

http:
  method: GET
  url: "{{baseUrl}}/works/:id"
  params:
    - name: id
      value: ""
      type: path
      description: ID of the work
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Work retrieved successfully
    request:
      url: "{{baseUrl}}/works/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: ID of the work
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "title": "",
            "type": "MANGA",
            "publisher": "",
            "author": "",
            "totalVolumes": 0,
            "coverUrl": ""
          }
  - name: 404 Response
    description: Work not found
    request:
      url: "{{baseUrl}}/works/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: ID of the work
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "title": "",
            "type": "MANGA",
            "publisher": "",
            "author": "",
            "totalVolumes": 0,
            "coverUrl": ""
          }

docs: Retrieves details of a specific work by its ID
