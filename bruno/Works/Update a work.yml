info:
  name: Update a work
  type: http
  seq: 2
  tags:
    - Works

http:
  method: PUT
  url: "{{baseUrl}}/works/:id"
  params:
    - name: id
      value: ""
      type: path
      description: ID of the work
  body:
    type: json
    data: |-
      {
        "title": "",
        "type": "MANGA",
        "publisher": "",
        "author": "",
        "totalVolumes": 0,
        "coverUrl": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

