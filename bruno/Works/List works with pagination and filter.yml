info:
  name: List works with pagination and filter
  type: http
  seq: 4
  tags:
    - Works

http:
  method: GET
  url: "{{baseUrl}}/works"
  params:
    - name: title
      value: ""
      type: query
      description: Filter works by title (case-insensitive contains)
      disabled: true
    - name: page
      value: "0"
      type: query
      description: Zero-based page index (0..N)
    - name: size
      value: "20"
      type: query
      description: The size of the page to be returned
    - name: sort
      value: "[]"
      type: query
      description: "Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported."
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Works retrieved successfully
    request:
      url: "{{baseUrl}}/works"
      method: GET
      params:
        - name: title
          value: ""
          type: query
          description: Filter works by title (case-insensitive contains)
          disabled: true
        - name: page
          value: "0"
          type: query
          description: Zero-based page index (0..N)
        - name: size
          value: "20"
          type: query
          description: The size of the page to be returned
        - name: sort
          value: "[]"
          type: query
          description: "Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported."
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "totalPages": 0,
            "totalElements": 0,
            "size": 0,
            "content": [
              {
                "id": 0,
                "title": "",
                "type": "MANGA",
                "publisher": "",
                "author": "",
                "totalVolumes": 0,
                "coverUrl": ""
              }
            ],
            "number": 0,
            "sort": {
              "empty": false,
              "sorted": false,
              "unsorted": false
            },
            "pageable": {
              "offset": 0,
              "paged": false,
              "pageNumber": 0,
              "pageSize": 0,
              "sort": {
                "empty": false,
                "sorted": false,
                "unsorted": false
              },
              "unpaged": false
            },
            "numberOfElements": 0,
            "first": false,
            "last": false,
            "empty": false
          }

docs: Retrieves a paginated list of works, optionally filtered by title
