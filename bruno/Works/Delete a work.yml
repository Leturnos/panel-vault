info:
  name: Delete a work
  type: http
  seq: 3
  tags:
    - Works

http:
  method: DELETE
  url: "{{baseUrl}}/works/:id"
  params:
    - name: id
      value: ""
      type: path
      description: ID of the work
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Work deleted successfully
    request:
      url: "{{baseUrl}}/works/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
          description: ID of the work
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized - invalid or missing JWT token
    request:
      url: "{{baseUrl}}/works/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
          description: ID of the work
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Work not found
    request:
      url: "{{baseUrl}}/works/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
          description: ID of the work
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""

docs: Deletes a specific work by its ID
