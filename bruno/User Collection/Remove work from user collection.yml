info:
  name: Remove work from user collection
  type: http
  seq: 3
  tags:
    - User Collection

http:
  method: DELETE
  url: "{{baseUrl}}/works/:workId/collection"
  params:
    - name: workId
      value: ""
      type: path
      description: ID of the work
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Work removed from collection successfully
    request:
      url: "{{baseUrl}}/works/:workId/collection"
      method: DELETE
      params:
        - name: workId
          value: ""
          type: path
          description: ID of the work
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized - invalid or missing JWT token
    request:
      url: "{{baseUrl}}/works/:workId/collection"
      method: DELETE
      params:
        - name: workId
          value: ""
          type: path
          description: ID of the work
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Collection entry not found
    request:
      url: "{{baseUrl}}/works/:workId/collection"
      method: DELETE
      params:
        - name: workId
          value: ""
          type: path
          description: ID of the work
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""

docs: Removes a work from the authenticated user's collection
