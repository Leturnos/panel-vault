info:
  name: Get user collection details for a work
  type: http
  seq: 1
  tags:
    - User Collection

http:
  method: GET
  url: "{{baseUrl}}/works/:workId/collection"
  params:
    - name: workId
      value: ""
      type: path
      description: ID of the work
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Collection entry retrieved successfully
    request:
      url: "{{baseUrl}}/works/:workId/collection"
      method: GET
      params:
        - name: workId
          value: ""
          type: path
          description: ID of the work
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "workId": 0,
            "workTitle": "",
            "status": "COMPLETED",
            "rating": 0
          }
  - name: 401 Response
    description: Unauthorized - invalid or missing JWT token
    request:
      url: "{{baseUrl}}/works/:workId/collection"
      method: GET
      params:
        - name: workId
          value: ""
          type: path
          description: ID of the work
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "workId": 0,
            "workTitle": "",
            "status": "COMPLETED",
            "rating": 0
          }
  - name: 404 Response
    description: Work or collection entry not found
    request:
      url: "{{baseUrl}}/works/:workId/collection"
      method: GET
      params:
        - name: workId
          value: ""
          type: path
          description: ID of the work
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "workId": 0,
            "workTitle": "",
            "status": "COMPLETED",
            "rating": 0
          }

docs: Retrieves user-specific tracking details for the specified work
