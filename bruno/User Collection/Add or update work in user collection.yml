info:
  name: Add or update work in user collection
  type: http
  seq: 2
  tags:
    - User Collection

http:
  method: PUT
  url: "{{baseUrl}}/works/:workId/collection"
  params:
    - name: workId
      value: ""
      type: path
      description: ID of the work
  body:
    type: json
    data: |-
      {
        "status": "COMPLETED",
        "rating": 0,
        "ratingStepValid": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Collection entry saved or updated successfully
    request:
      url: "{{baseUrl}}/works/:workId/collection"
      method: PUT
      params:
        - name: workId
          value: ""
          type: path
          description: ID of the work
      body:
        type: json
        data: |-
          {
            "status": "COMPLETED",
            "rating": 0,
            "ratingStepValid": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "workId": 0,
            "workTitle": "",
            "status": "COMPLETED",
            "rating": 0
          }
  - name: 400 Response
    description: Invalid payload or validation error
    request:
      url: "{{baseUrl}}/works/:workId/collection"
      method: PUT
      params:
        - name: workId
          value: ""
          type: path
          description: ID of the work
      body:
        type: json
        data: |-
          {
            "status": "COMPLETED",
            "rating": 0,
            "ratingStepValid": false
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "workId": 0,
            "workTitle": "",
            "status": "COMPLETED",
            "rating": 0
          }
  - name: 401 Response
    description: Unauthorized - invalid or missing JWT token
    request:
      url: "{{baseUrl}}/works/:workId/collection"
      method: PUT
      params:
        - name: workId
          value: ""
          type: path
          description: ID of the work
      body:
        type: json
        data: |-
          {
            "status": "COMPLETED",
            "rating": 0,
            "ratingStepValid": false
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "workId": 0,
            "workTitle": "",
            "status": "COMPLETED",
            "rating": 0
          }
  - name: 404 Response
    description: Work not found
    request:
      url: "{{baseUrl}}/works/:workId/collection"
      method: PUT
      params:
        - name: workId
          value: ""
          type: path
          description: ID of the work
      body:
        type: json
        data: |-
          {
            "status": "COMPLETED",
            "rating": 0,
            "ratingStepValid": false
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "workId": 0,
            "workTitle": "",
            "status": "COMPLETED",
            "rating": 0
          }

docs: Saves or updates tracking details (reading status, rating, etc.) for a work in the authenticated user's collection
