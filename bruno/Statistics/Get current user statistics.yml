info:
  name: Get current user statistics
  type: http
  seq: 2
  tags:
    - Statistics

http:
  method: GET
  url: "{{baseUrl}}/stats/me"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: User statistics retrieved successfully
    request:
      url: "{{baseUrl}}/stats/me"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "totalWorks": 0,
            "totalVolumes": 0,
            "completedWorks": 0,
            "onGoingWorks": 0,
            "wishlistItems": 0,
            "totalMangas": 0,
            "totalComics": 0,
            "totalGraphicNovels": 0,
            "totalManhwas": 0
          }
  - name: 401 Response
    description: Unauthorized - invalid or missing JWT token
    request:
      url: "{{baseUrl}}/stats/me"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "totalWorks": 0,
            "totalVolumes": 0,
            "completedWorks": 0,
            "onGoingWorks": 0,
            "wishlistItems": 0,
            "totalMangas": 0,
            "totalComics": 0,
            "totalGraphicNovels": 0,
            "totalManhwas": 0
          }

docs: Retrieves statistics specific to the authenticated user's collection
