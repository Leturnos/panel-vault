info:
  name: Delete volume by ID
  type: http
  seq: 4
  tags:
    - Volumes

http:
  method: DELETE
  url: "{{baseUrl}}/volumes/:id"
  params:
    - name: id
      value: ""
      type: path
      description: ID of the volume
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Volume deleted successfully
    request:
      url: "{{baseUrl}}/volumes/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
          description: ID of the volume
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized - invalid or missing JWT token
    request:
      url: "{{baseUrl}}/volumes/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
          description: ID of the volume
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Volume not found
    request:
      url: "{{baseUrl}}/volumes/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
          description: ID of the volume
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""

docs: Deletes a specific volume by its ID
