info:
  name: List all volumes of a work
  type: http
  seq: 2
  tags:
    - Volumes

http:
  method: GET
  url: "{{baseUrl}}/works/:workId/volumes"
  params:
    - name: workId
      value: ""
      type: path
      description: ID of the work
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Volumes retrieved successfully
    request:
      url: "{{baseUrl}}/works/:workId/volumes"
      method: GET
      params:
        - name: workId
          value: ""
          type: path
          description: ID of the work
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          [
            {
              "id": 0,
              "number": 0,
              "purchaseDate": "",
              "purchasePrice": 0,
              "owned": false,
              "workId": 0
            }
          ]
  - name: 401 Response
    description: Unauthorized - invalid or missing JWT token
    request:
      url: "{{baseUrl}}/works/:workId/volumes"
      method: GET
      params:
        - name: workId
          value: ""
          type: path
          description: ID of the work
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          [
            {
              "id": 0,
              "number": 0,
              "purchaseDate": "",
              "purchasePrice": 0,
              "owned": false,
              "workId": 0
            }
          ]
  - name: 404 Response
    description: Work not found
    request:
      url: "{{baseUrl}}/works/:workId/volumes"
      method: GET
      params:
        - name: workId
          value: ""
          type: path
          description: ID of the work
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          [
            {
              "id": 0,
              "number": 0,
              "purchaseDate": "",
              "purchasePrice": 0,
              "owned": false,
              "workId": 0
            }
          ]

docs: Retrieves all volumes associated with the specified work
