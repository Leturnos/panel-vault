info:
  name: Add a volume to a work
  type: http
  seq: 1
  tags:
    - Volumes

http:
  method: POST
  url: "{{baseUrl}}/works/:id/volumes"
  params:
    - name: id
      value: ""
      type: path
      description: ID of the work
  body:
    type: json
    data: |-
      {
        "number": 0,
        "purchaseDate": "",
        "purchasePrice": 0,
        "owned": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
